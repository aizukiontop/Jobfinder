user jobfinder-web jobfinder-web;
worker_processes 1;

pid /run/jobfinder-nginx/nginx.pid;
error_log stderr warn;

events {
    worker_connections 256;
    multi_accept off;
}

http {
    # This is the only file read from the system Nginx configuration tree.
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    server_tokens off;
    access_log off;

    sendfile on;
    tcp_nopush on;
    keepalive_timeout 15s;
    keepalive_requests 100;
    reset_timedout_connection on;

    client_header_timeout 15s;
    client_body_timeout 30s;
    send_timeout 30s;
    client_max_body_size 6m;
    client_body_buffer_size 16k;
    client_body_temp_path /var/lib/jobfinder-nginx/client_temp 1 2;
    proxy_temp_path /var/lib/jobfinder-nginx/proxy_temp 1 2;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:jobfinder_tls:1m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Deploy exactly one of the staged site files as this custom site file.
    include /etc/jobfinder-nginx/site.conf;
}
