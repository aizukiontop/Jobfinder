# Certificate bootstrap configuration. It intentionally exposes only the
# HTTP-01 challenge directory and does not proxy to the application.

server {
    listen 80 default_server;
    server_name _;

    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name jobfinder.47-236-129-80.sslip.io;

    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/jobfinder-nginx/acme;
        default_type text/plain;
        disable_symlinks on;
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    # The bootstrap listener never exposes the API over plaintext HTTP.
    location ^~ /api/ {
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(self)" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 403;
    }

    location / {
        add_header Retry-After 300 always;
        add_header Cache-Control "no-store" always;
        add_header X-Frame-Options "DENY" always;
        add_header Permissions-Policy "geolocation=(self)" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        return 503;
    }
}
