# Final same-origin site for the temporary sslip.io hostname. The application
# data and uploads are deliberately outside this document root.

server {
    listen 80 default_server;
    server_name _;

    location / {
        return 444;
    }
}

server {
    listen 80;
    server_name jobfinder.47-236-129-80.sslip.io;

    add_header X-Frame-Options "DENY" always;
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header X-Robots-Tag "noindex, nofollow" always;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/jobfinder-nginx/acme;
        default_type text/plain;
        disable_symlinks on;
        try_files $uri =404;
        access_log off;
        log_not_found off;
    }

    location / {
        return 308 https://jobfinder.47-236-129-80.sslip.io$request_uri;
    }
}

server {
    listen 443 ssl default_server;
    server_name _;

    ssl_certificate /etc/jobfinder-nginx/tls/current/fullchain.pem;
    ssl_certificate_key /etc/jobfinder-nginx/tls/current/privkey.pem;

    location / {
        return 444;
    }
}

server {
    listen 443 ssl;
    server_name jobfinder.47-236-129-80.sslip.io;

    ssl_certificate /etc/jobfinder-nginx/tls/current/fullchain.pem;
    ssl_certificate_key /etc/jobfinder-nginx/tls/current/privkey.pem;

    root /opt/jobfinder-public/web;
    index index.html;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "geolocation=(self)" always;
    add_header X-Robots-Tag "noindex, nofollow" always;
    add_header Strict-Transport-Security "max-age=86400" always;

    location ^~ /api/ {
        # GET also permits HEAD in nginx's limit_except semantics. All account,
        # application, upload, and other mutation methods remain unavailable on
        # this temporary shared-DNS hostname.
        limit_except GET {
            deny all;
        }

        proxy_pass http://127.0.0.1:3210;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto https;

        proxy_connect_timeout 3s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
        proxy_next_upstream off;

        proxy_request_buffering on;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 4 4k;
        proxy_busy_buffers_size 8k;
        proxy_max_temp_file_size 8m;
        proxy_temp_file_write_size 64k;
        proxy_hide_header X-Powered-By;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;

        # add_header directives are not inherited once this location defines
        # one, so repeat every server security header alongside no-store.
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Permissions-Policy "geolocation=(self)" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
        add_header Strict-Transport-Security "max-age=86400" always;
    }

    # Defense in depth: private storage paths and database-like file types must
    # never be served. Public /data assets such as roadGraph.json remain usable.
    location ~* ^/(?:uploads?|backups?)(?:/|$) {
        return 404;
    }

    location ~* \.(?:sqlite3?|db|wal|shm|env|pem|key)$ {
        return 404;
    }

    location ~ (^|/)\. {
        return 404;
    }

    location / {
        disable_symlinks on from=/opt/jobfinder-public/web;
        try_files $uri $uri/ /index.html;
    }
}
